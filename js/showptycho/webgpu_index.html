<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShowPtycho WebGPU Kernel Probe</title>
  <style>
    :root { color-scheme: dark; --bg:#101214; --panel:#181b1f; --line:#2b3036; --text:#e7edf3; --muted:#9aa7b5; --bad:#ff6b6b; --ok:#57d68d; --warn:#f6c85f; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); background: #121519; position: sticky; top: 0; z-index: 3; }
    h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: 0; }
    .sub { margin-top: 4px; color: var(--muted); font-size: 12px; }
    main { padding: 16px 18px 28px; max-width: 1460px; margin: 0 auto; }
    .toolbar { display:flex; gap: 10px; align-items:center; flex-wrap:wrap; margin-bottom: 14px; }
    button { border: 1px solid #3a4652; background:#20262d; color:var(--text); padding: 7px 10px; border-radius:6px; cursor:pointer; font-size: 13px; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    input[type="range"] { width: 220px; accent-color:#62a8ff; }
    label { color:var(--muted); font-size:12px; display:flex; gap:8px; align-items:center; }
    .status { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); white-space: pre-wrap; margin: 8px 0 14px; }
    .grid { display:grid; grid-template-columns: repeat(3, minmax(220px,1fr)); gap: 12px; }
    .card { border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:10px; min-width:0; }
    .card h2 { margin:0 0 8px; font-size: 13px; font-weight: 650; color:#dbe6f2; }
    canvas { display:block; width:100%; aspect-ratio:1/1; image-rendering: pixelated; background:#050608; border-radius:4px; }
    table { border-collapse: collapse; width:100%; margin-top:14px; font-size:12px; }
    th, td { border-bottom:1px solid var(--line); padding:7px 8px; text-align:right; }
    th:first-child, td:first-child { text-align:left; }
    .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } input[type="range"] { width: 150px; } }
  </style>
</head>
<body>
<header>
  <h1>ShowPtycho WebGPU Kernel Probe</h1>
  <div class="sub" id="subtitle">Loading manifest…</div>
</header>
<main>
  <div class="toolbar">
    <button id="runBtn">Run Full BF WebGPU</button>
    <button id="dragBtn" disabled>Preview C10 Drag</button>
    <label>C10 <input id="c10" type="range" min="-100" max="150" value="50" step="1"><span id="c10v">50 nm</span></label>
    <label>C12 <input id="c12" type="range" min="0" max="80" value="22" step="1"><span id="c12v">22 nm</span></label>
    <label>phi12 <input id="phi12" type="range" min="-180" max="180" value="76" step="1"><span id="phi12v">76 deg</span></label>
  </div>
  <div class="status" id="status">Idle.</div>
  <table id="metrics"><thead><tr><th>Check</th><th>max abs err</th><th>mean abs err</th><th>max rel err</th><th>mean rel err</th><th>status</th></tr></thead><tbody></tbody></table>
  <div class="grid" style="margin-top:14px">
    <div class="card"><h2>Python Phase</h2><canvas id="refPhase"></canvas></div>
    <div class="card"><h2>WebGPU Phase</h2><canvas id="gpuPhase"></canvas></div>
    <div class="card"><h2>|Phase Difference|</h2><canvas id="diffPhase"></canvas></div>
    <div class="card"><h2>Python FFT</h2><canvas id="refFft"></canvas></div>
    <div class="card"><h2>WebGPU FFT</h2><canvas id="gpuFft"></canvas></div>
    <div class="card"><h2>|FFT Difference|</h2><canvas id="diffFft"></canvas></div>
  </div>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const subtitleEl = $('subtitle');
const runBtn = $('runBtn');
const dragBtn = $('dragBtn');
const SUPPORTED_SSB_SIZES = [128, 256, 512, 1024];
let N = 0;
let PLANE = 0;
let previewBfCount = 1;
let phaseDisplayRange = { lo: 0, hi: 1 };
const TWO_PI = Math.PI * 2;
const ATOL = 5e-4;
const RTOL = 1e-4;
let device, adapterInfo = 'unknown', softwareAdapter = false;
let manifest, cal, refPhase, refFft, gArrayBuffer;
let buffers = {}, pipelines = {}, bindGroups = {}, latestPhase = null, latestFft = null;
let phaseRenderer = null;
let initializedGpu = false;
let runningNow = false, pendingRun = null, sliderTimer = null;

function log(msg) { statusEl.textContent = msg; }
function append(msg) { statusEl.textContent += '\n' + msg; }
function fmt(x) { return Number.isFinite(x) ? x.toExponential(4) : String(x); }
function passMetric(m) { return m.maxAbs <= Math.max(ATOL, RTOL * Math.max(1, m.refMaxAbs)); }
function setSliderLabels() {
  $('c10v').textContent = `${$('c10').value} nm`;
  $('c12v').textContent = `${$('c12').value} nm`;
  $('phi12v').textContent = `${$('phi12').value} deg`;
}
function scheduleSliderRun(label='slider drag') {
  if (!initializedGpu) return;
  if (sliderTimer) clearTimeout(sliderTimer);
  sliderTimer = setTimeout(() => runCurrent(label, { parity: false }), 0);
}
['c10','c12','phi12'].forEach(id => $(id).addEventListener('input', () => {
  setSliderLabels();
  scheduleSliderRun('slider drag');
}));
setSliderLabels();

async function fetchArrayBufferProgress(url, label) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  const total = Number(res.headers.get('content-length') || 0);
  if (!res.body || !total) return await res.arrayBuffer();
  const reader = res.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.byteLength;
    log(`${label}: ${(received / 1e6).toFixed(1)} / ${(total / 1e6).toFixed(1)} MB`);
  }
  const out = new Uint8Array(received);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.byteLength; }
  return out.buffer;
}

async function loadData() {
  manifest = await (await fetch('manifest.json')).json();
  cal = await (await fetch(manifest.calibration)).json();
  const shape = cal.g_shape || manifest.arrays?.g_bf?.shape || [];
  const ny = Number(shape[1] || 0), nx = Number(shape[2] || 0);
  if (ny !== nx || !SUPPORTED_SSB_SIZES.includes(ny)) {
    throw new Error(`ShowPtycho WebGPU probe supports square ${SUPPORTED_SSB_SIZES.join('/')} G(k), got ${shape.join('x')}`);
  }
  N = ny;
  PLANE = N * N;
  previewBfCount = Math.max(1, Math.min(Number(manifest.preview_bf_count || 1), Number(cal.num_bf || 1)));
  subtitleEl.textContent = `${cal.num_bf} BF pixels, crop ${cal.scan_region.row_start}:${cal.scan_region.row_stop}, ${cal.scan_region.col_start}:${cal.scan_region.col_stop}, C10 ${cal.aberrations.C10} nm`;
  refPhase = new Float32Array(await fetchArrayBufferProgress(manifest.arrays.ref_phase.path, 'ref phase'));
  refFft = new Float32Array(await fetchArrayBufferProgress(manifest.arrays.ref_fft.path, 'ref FFT'));
  phaseDisplayRange = { lo: percentile(refPhase, 1), hi: percentile(refPhase, 99) };
  drawScalar($('refPhase'), refPhase, N, N, 'viridis');
  drawScalar($('refFft'), refFft, N, N, 'inferno');
  gArrayBuffer = await fetchArrayBufferProgress(manifest.arrays.g_bf.path, 'G(k)');
  append(`Loaded ${(gArrayBuffer.byteLength / 1e6).toFixed(1)} MB G(k).`);
}

async function initWebGPU() {
  if (!navigator.gpu) throw new Error('WebGPU not available in this browser. Use Chrome with hardware WebGPU enabled.');
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) throw new Error('No WebGPU adapter returned.');
  const info = adapter.info || (await adapter.requestAdapterInfo?.()) || {};
  adapterInfo = info.description || `${info.vendor || ''} ${info.architecture || ''} ${info.device || ''}`.trim() || 'Generic WebGPU Adapter';
  softwareAdapter = /swiftshader|llvmpipe|software|subzero/i.test(adapterInfo);
  const requiredLimits = {};
  for (const key of [
    'maxBufferSize',
    'maxStorageBufferBindingSize',
    'maxComputeInvocationsPerWorkgroup',
    'maxComputeWorkgroupSizeX',
  ]) {
    const v = adapter.limits[key] || 0;
    if (v > 0) requiredLimits[key] = v;
  }
  device = await adapter.requestDevice({ requiredLimits });
  window.__SHOWPTYCHO_WAIT_GPU__ = () => device.queue.onSubmittedWorkDone();
  device.lost.then((info) => append(`WebGPU device lost: ${info.message || info.reason}`));
  append(`Adapter: ${adapterInfo}${softwareAdapter ? ' (software; timing invalid)' : ''}`);
  append(`Limits: maxBufferSize=${adapter.limits.maxBufferSize}, maxStorageBufferBindingSize=${adapter.limits.maxStorageBufferBindingSize}`);
}

function makeBufferFromBytes(bytes, usage, label) {
  const buffer = device.createBuffer({ size: bytes.byteLength, usage: usage | GPUBufferUsage.COPY_DST, label });
  const chunk = 32 * 1024 * 1024;
  for (let off = 0; off < bytes.byteLength; off += chunk) {
    const len = Math.min(chunk, bytes.byteLength - off);
    device.queue.writeBuffer(buffer, off, new Uint8Array(bytes.buffer, bytes.byteOffset + off, len));
  }
  return buffer;
}
function makeBufferFromF32(arr, usage, label) {
  return makeBufferFromBytes(new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength), usage, label);
}
function makeEmptyBuffer(byteLength, usage, label) {
  return device.createBuffer({ size: byteLength, usage, label });
}
function makeParams(c10, c12, phi12Rad) {
  const b = new ArrayBuffer(64);
  const u = new Uint32Array(b);
  const f = new Float32Array(b);
  u[0] = cal.num_bf; u[1] = N; u[2] = PLANE; u[3] = 0;
  f[4] = cal.wavelength_A; f[5] = cal.semiangle_rad; f[6] = cal.angular_sampling_rad[0]; f[7] = cal.angular_sampling_rad[1];
  f[8] = c10; f[9] = c12; f[10] = Math.cos(2 * phi12Rad); f[11] = Math.sin(2 * phi12Rad);
  f[12] = Math.PI / cal.wavelength_A; f[13] = cal.dc_value[0]; f[14] = cal.dc_value[1]; f[15] = 1 / (N * N);
  return b;
}
function makeFftParams(sign) {
  const b = new ArrayBuffer(16);
  const u = new Uint32Array(b);
  const f = new Float32Array(b);
  u[0] = N; u[1] = PLANE; f[2] = sign; f[3] = 0;
  return b;
}

function makeFftStages(n, signExpr) {
  const workgroupSize = Math.min(n, 256);
  const lines = ['  workgroupBarrier();'];
  for (let len = 2; len <= n; len *= 2) {
    const half = len / 2;
    lines.push(
      `  for (var butterfly = tid; butterfly < ${n / 2}u; butterfly = butterfly + ${workgroupSize}u) {`,
      `    let group = butterfly / ${half}u;`,
      `    let j = butterfly - group * ${half}u;`,
      `    let i0 = group * ${len}u + j;`,
      `    let i1 = i0 + ${half}u;`,
      `    let angle = ${signExpr} * 6.283185307179586 * f32(j) / ${len}.0;`,
      '    let w = vec2<f32>(cos(angle), sin(angle));',
      '    let t = cmul(w, s[i1]);',
      '    let u = s[i0];',
      '    s[i0] = u + t;',
      '    s[i1] = u - t;',
      '  }',
      '  workgroupBarrier();',
    );
  }
  return lines.join('\n');
}

function makeReduceBody(numBf) {
  const lines = [
    '  var sum = 0.0;',
    '  var sumsq = 0.0;',
  ];
  for (let bf = 0; bf < numBf; bf++) {
    lines.push(
      `  {`,
      `    let a = phaseStack[${bf}u * params.plane + idx];`,
      '    sum += a;',
      '    sumsq += a * a;',
      '  }',
    );
  }
  lines.push(
    `  let mean = sum / ${numBf}.0;`,
    '  phaseOut[idx] = mean;',
    `  varianceOut[idx] = sumsq / ${numBf}.0 - mean * mean;`,
  );
  return lines.join('\n');
}

function makeSsbShader(n, numBf) {
  const reverseShift = 32 - Math.log2(n);
  const workgroupSize = Math.min(n, 256);
  return `
struct Params {
  num_bf: u32,
  n: u32,
  plane: u32,
  _pad0: u32,
  wavelength: f32,
  semiangle_rad: f32,
  ang_y_rad: f32,
  ang_x_rad: f32,
  C10: f32,
  C12: f32,
  cos2phi12: f32,
  sin2phi12: f32,
  factor: f32,
  dc_re: f32,
  dc_im: f32,
  inv_n2: f32,
};
@group(0) @binding(0) var<uniform> params: Params;
@group(0) @binding(1) var<storage, read> gqk: array<vec2<f32>>;
@group(0) @binding(2) var<storage, read_write> stage: array<vec2<f32>>;
@group(0) @binding(3) var<storage, read> bfGeom: array<vec4<f32>>;  // kx, ky, alpha_k2, aperture
@group(0) @binding(4) var<storage, read> bfTrig: array<vec2<f32>>;  // cos2phi, sin2phi
@group(0) @binding(5) var<storage, read> qx1d: array<f32>;
@group(0) @binding(6) var<storage, read> qy1d: array<f32>;
@group(0) @binding(7) var<storage, read_write> phaseStack: array<f32>;
@group(0) @binding(8) var<storage, read_write> phaseOut: array<f32>;
@group(0) @binding(9) var<storage, read_write> varianceOut: array<f32>;

var<workgroup> s: array<vec2<f32>, ${n}>;

fn cmul(a: vec2<f32>, b: vec2<f32>) -> vec2<f32> { return vec2<f32>(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
fn bit_reverse(x0: u32) -> u32 {
  return reverseBits(x0) >> ${reverseShift}u;
}
fn compute_geometry(dx: f32, dy: f32) -> vec4<f32> {
  let dx2 = dx * dx;
  let dy2 = dy * dy;
  let r2 = dx2 + dy2;
  let r = sqrt(r2);
  let alpha = r * params.wavelength;
  let alpha2 = alpha * alpha;
  let inv_r2 = select(0.0, 1.0 / r2, r2 > 1e-30);
  let cos2phi = (dx2 - dy2) * inv_r2;
  let sin2phi = 2.0 * dx * dy * inv_r2;
  let denom_num2 = (dx * params.ang_y_rad) * (dx * params.ang_y_rad) + (dy * params.ang_x_rad) * (dy * params.ang_x_rad);
  let inv_r = select(0.0, 1.0 / r, r > 1e-15);
  let denom = sqrt(denom_num2) * inv_r;
  let edge = select(1.0, (params.semiangle_rad - alpha) / denom + 0.5, denom > 1e-15);
  return vec4<f32>(alpha2, cos2phi, sin2phi, clamp(edge, 0.0, 1.0));
}
fn gamma_mul(qx: f32, qy: f32, kx: f32, ky: f32, pk: vec2<f32>, G: vec2<f32>) -> vec2<f32> {
  let m = compute_geometry(qx - kx, qy - ky);
  let p = compute_geometry(qx + kx, qy + ky);
  let cos_term_m = m.y * params.cos2phi12 + m.z * params.sin2phi12;
  let cos_term_p = p.y * params.cos2phi12 + p.z * params.sin2phi12;
  let chi_m = params.factor * m.x * (params.C12 * cos_term_m + params.C10);
  let chi_p = params.factor * p.x * (params.C12 * cos_term_p + params.C10);
  let pm = vec2<f32>(m.w * cos(chi_m), -m.w * sin(chi_m));
  let pp = vec2<f32>(p.w * cos(chi_p), -p.w * sin(chi_p));
  let pk_conj = vec2<f32>(pk.x, -pk.y);
  let pp_conj = vec2<f32>(pp.x, -pp.y);
  let t1 = cmul(pm, pk_conj);
  let t2 = cmul(pp_conj, pk);
  var gg = t1 - t2;
  let mag_sq = gg.x * gg.x + gg.y * gg.y;
  let inv_mag = select(1e8, inverseSqrt(mag_sq), mag_sq > 1e-16);
  gg *= inv_mag;
  return vec2<f32>(G.x * gg.x + G.y * gg.y, G.y * gg.x - G.x * gg.y);
}
fn fft_inplace(tid: u32, sign: f32) {
${makeFftStages(n, 'sign')}
}

@compute @workgroup_size(${workgroupSize})
fn ssbRows(@builtin(local_invocation_id) lid: vec3<u32>, @builtin(workgroup_id) wid: vec3<u32>) {
  let tid = lid.x;
  let row = wid.y;
  let bf = wid.z;
  let base = (bf * params.plane) + row * ${n}u;
  let bg = bfGeom[bf];
  let bt = bfTrig[bf];
  let cos_term_k = bt.x * params.cos2phi12 + bt.y * params.sin2phi12;
  let chi_k = params.factor * bg.z * (params.C12 * cos_term_k + params.C10);
  let pk = vec2<f32>(bg.w * cos(chi_k), -bg.w * sin(chi_k));
  for (var off = 0u; off < ${n}u; off = off + ${workgroupSize}u) {
    let x = off + tid;
    if (x < ${n}u) {
      let idx = base + x;
      var v = gamma_mul(qx1d[row], qy1d[x], bg.x, bg.y, pk, gqk[idx]);
      if (row == 0u && x == 0u) { v = vec2<f32>(params.dc_re, params.dc_im); }
      s[bit_reverse(x)] = v;
    }
  }
  fft_inplace(tid, 1.0);
  for (var off = 0u; off < ${n}u; off = off + ${workgroupSize}u) {
    let x = off + tid;
    if (x < ${n}u) { stage[base + x] = s[x]; }
  }
}

@compute @workgroup_size(${workgroupSize})
fn ssbCols(@builtin(local_invocation_id) lid: vec3<u32>, @builtin(workgroup_id) wid: vec3<u32>) {
  let tid = lid.x;
  let col = wid.y;
  let bf = wid.z;
  let base = bf * params.plane;
  for (var off = 0u; off < ${n}u; off = off + ${workgroupSize}u) {
    let y = off + tid;
    if (y < ${n}u) { s[bit_reverse(y)] = stage[base + y * ${n}u + col]; }
  }
  fft_inplace(tid, 1.0);
  for (var off = 0u; off < ${n}u; off = off + ${workgroupSize}u) {
    let y = off + tid;
    if (y < ${n}u) {
      let idx = base + y * ${n}u + col;
      let v = s[y] * params.inv_n2;
      phaseStack[idx] = atan2(v.y, v.x);
    }
  }
}

@compute @workgroup_size(256)
fn reducePhase(@builtin(global_invocation_id) gid: vec3<u32>) {
  let idx = gid.x;
  if (idx >= params.plane) { return; }
${makeReduceBody(numBf)}
}`;
}

function makeFftShader(n) {
  const reverseShift = 32 - Math.log2(n);
  const half = n / 2;
  const mask = n - 1;
  const workgroupSize = Math.min(n, 256);
  return `
struct FftParams { n: u32, plane: u32, sign: f32, _pad0: f32 };
@group(0) @binding(0) var<uniform> params: FftParams;
@group(0) @binding(1) var<storage, read_write> data: array<vec2<f32>>;
@group(0) @binding(2) var<storage, read_write> magOut: array<f32>;
var<workgroup> s: array<vec2<f32>, ${n}>;
fn cmul(a: vec2<f32>, b: vec2<f32>) -> vec2<f32> { return vec2<f32>(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
fn bit_reverse(x0: u32) -> u32 {
  return reverseBits(x0) >> ${reverseShift}u;
}

fn fft_inplace(tid: u32) {
${makeFftStages(n, 'params.sign')}
}
@compute @workgroup_size(${workgroupSize})
fn fftRows(@builtin(local_invocation_id) lid: vec3<u32>, @builtin(workgroup_id) wid: vec3<u32>) {
  let tid = lid.x;
  let row = wid.y;
  let base = row * ${n}u;
  for (var off = 0u; off < ${n}u; off = off + ${workgroupSize}u) {
    let x = off + tid;
    if (x < ${n}u) { s[bit_reverse(x)] = data[base + x]; }
  }
  fft_inplace(tid);
  for (var off = 0u; off < ${n}u; off = off + ${workgroupSize}u) {
    let x = off + tid;
    if (x < ${n}u) { data[base + x] = s[x]; }
  }
}
@compute @workgroup_size(${workgroupSize})
fn fftColsMag(@builtin(local_invocation_id) lid: vec3<u32>, @builtin(workgroup_id) wid: vec3<u32>) {
  let tid = lid.x;
  let col = wid.y;
  for (var off = 0u; off < ${n}u; off = off + ${workgroupSize}u) {
    let y = off + tid;
    if (y < ${n}u) { s[bit_reverse(y)] = data[y * ${n}u + col]; }
  }
  fft_inplace(tid);
  for (var off = 0u; off < ${n}u; off = off + ${workgroupSize}u) {
    let y = off + tid;
    if (y < ${n}u) {
      let v = s[y];
      let shiftedY = (y + ${half}u) & ${mask}u;
      let shiftedX = (col + ${half}u) & ${mask}u;
      let outIdx = shiftedY * ${n}u + shiftedX;
      magOut[outIdx] = log(1.0 + sqrt(v.x * v.x + v.y * v.y));
    }
  }
}`;
}

function makePhaseRenderShader() {
  return `
struct RenderParams {
  width: u32,
  height: u32,
  vmin: f32,
  vmax: f32,
};
@group(0) @binding(0) var<storage, read> phase: array<f32>;
@group(0) @binding(1) var<uniform> params: RenderParams;

struct VsOut {
  @builtin(position) pos: vec4<f32>,
  @location(0) uv: vec2<f32>,
};

@vertex
fn vs(@builtin(vertex_index) vertexIndex: u32) -> VsOut {
  var pos = array<vec2<f32>, 6>(
    vec2<f32>(-1.0, -1.0),
    vec2<f32>( 1.0, -1.0),
    vec2<f32>(-1.0,  1.0),
    vec2<f32>(-1.0,  1.0),
    vec2<f32>( 1.0, -1.0),
    vec2<f32>( 1.0,  1.0),
  );
  var uv = array<vec2<f32>, 6>(
    vec2<f32>(0.0, 1.0),
    vec2<f32>(1.0, 1.0),
    vec2<f32>(0.0, 0.0),
    vec2<f32>(0.0, 0.0),
    vec2<f32>(1.0, 1.0),
    vec2<f32>(1.0, 0.0),
  );
  var out: VsOut;
  out.pos = vec4<f32>(pos[vertexIndex], 0.0, 1.0);
  out.uv = uv[vertexIndex];
  return out;
}

fn interp(a: vec3<f32>, b: vec3<f32>, t: f32) -> vec3<f32> {
  return a * (1.0 - t) + b * t;
}
fn viridis(t0: f32) -> vec3<f32> {
  let t = clamp(t0, 0.0, 1.0);
  if (t < 0.25) { return interp(vec3<f32>(0.267, 0.004, 0.329), vec3<f32>(0.231, 0.322, 0.545), t / 0.25); }
  if (t < 0.50) { return interp(vec3<f32>(0.231, 0.322, 0.545), vec3<f32>(0.129, 0.569, 0.549), (t - 0.25) / 0.25); }
  if (t < 0.75) { return interp(vec3<f32>(0.129, 0.569, 0.549), vec3<f32>(0.369, 0.788, 0.384), (t - 0.50) / 0.25); }
  return interp(vec3<f32>(0.369, 0.788, 0.384), vec3<f32>(0.992, 0.906, 0.145), (t - 0.75) / 0.25);
}

@fragment
fn fs(in: VsOut) -> @location(0) vec4<f32> {
  let x = min(params.width - 1u, u32(in.uv.x * f32(params.width)));
  let y = min(params.height - 1u, u32(in.uv.y * f32(params.height)));
  let v = phase[y * params.width + x];
  let span = max(1e-12, params.vmax - params.vmin);
  let finite = v == v;
  let t = select(0.5, (v - params.vmin) / span, finite);
  return vec4<f32>(viridis(t), 1.0);
}`;
}

function setupPhaseRenderer() {
  if (phaseRenderer) return true;
  const canvas = $('gpuPhase');
  const context = canvas.getContext('webgpu');
  if (!context) return false;
  canvas.width = N;
  canvas.height = N;
  const format = navigator.gpu.getPreferredCanvasFormat();
  context.configure({ device, format, alphaMode: 'opaque' });
  const module = device.createShaderModule({ code: makePhaseRenderShader(), label: 'phase preview render WGSL' });
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-list' },
  });
  const params = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST, label: 'phase render params' });
  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: buffers.phase } },
      { binding: 1, resource: { buffer: params } },
    ],
  });
  phaseRenderer = { context, pipeline, params, bindGroup };
  return true;
}

function writePhaseRenderParams(lo, hi) {
  const b = new ArrayBuffer(16);
  const u = new Uint32Array(b);
  const f = new Float32Array(b);
  u[0] = N;
  u[1] = N;
  f[2] = lo;
  f[3] = hi;
  device.queue.writeBuffer(phaseRenderer.params, 0, b);
}

function encodePhaseRender(enc, lo, hi) {
  if (!setupPhaseRenderer()) return false;
  writePhaseRenderParams(lo, hi);
  const view = phaseRenderer.context.getCurrentTexture().createView();
  const pass = enc.beginRenderPass({
    colorAttachments: [{
      view,
      clearValue: { r: 0.02, g: 0.024, b: 0.032, a: 1 },
      loadOp: 'clear',
      storeOp: 'store',
    }],
  });
  pass.setPipeline(phaseRenderer.pipeline);
  pass.setBindGroup(0, phaseRenderer.bindGroup);
  pass.draw(6);
  pass.end();
  return true;
}

function drawPhaseWebGPU(lo, hi) {
  if (!setupPhaseRenderer()) return false;
  const enc = device.createCommandEncoder();
  encodePhaseRender(enc, lo, hi);
  device.queue.submit([enc.finish()]);
  return true;
}

function packGeometry() {
  const nbf = cal.num_bf;
  const geom = new Float32Array(nbf * 4);
  const trig = new Float32Array(nbf * 2);
  for (let i = 0; i < nbf; i++) {
    geom[i*4+0] = cal.kx_bf[i];
    geom[i*4+1] = cal.ky_bf[i];
    geom[i*4+2] = cal.alpha_k2[i];
    geom[i*4+3] = cal.aperture_k[i];
    trig[i*2+0] = cal.cos2phi_k[i];
    trig[i*2+1] = cal.sin2phi_k[i];
  }
  return { geom, trig };
}

async function setupGpuBuffers() {
  if (initializedGpu) return;
  const nbf = cal.num_bf;
  const neededThreads = Math.min(N, 256);
  if (device.limits.maxComputeInvocationsPerWorkgroup < neededThreads || device.limits.maxComputeWorkgroupSizeX < neededThreads) {
    throw new Error(
      `WebGPU adapter supports workgroup x=${device.limits.maxComputeWorkgroupSizeX}, `
      + `invocations=${device.limits.maxComputeInvocationsPerWorkgroup}; ${N}x${N} SSB needs ${neededThreads}.`,
    );
  }
  const gFloats = new Float32Array(gArrayBuffer);
  if (gFloats.length !== nbf * PLANE * 2) throw new Error(`G(k) length mismatch: ${gFloats.length}`);
  const { geom, trig } = packGeometry();
  buffers.params = makeEmptyBuffer(64, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST, 'params');
  buffers.gqk = makeBufferFromBytes(new Uint8Array(gArrayBuffer), GPUBufferUsage.STORAGE, 'g_bf.c64');
  gArrayBuffer = null;
  buffers.stage = makeEmptyBuffer(nbf * PLANE * 8, GPUBufferUsage.STORAGE, 'ssb stage');
  buffers.phaseStack = makeEmptyBuffer(nbf * PLANE * 4, GPUBufferUsage.STORAGE, 'phase stack');
  buffers.phase = makeEmptyBuffer(PLANE * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, 'phase out');
  buffers.variance = makeEmptyBuffer(PLANE * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, 'variance out');
  buffers.bfGeom = makeBufferFromF32(geom, GPUBufferUsage.STORAGE, 'bf geom');
  buffers.bfTrig = makeBufferFromF32(trig, GPUBufferUsage.STORAGE, 'bf trig');
  buffers.qx = makeBufferFromF32(new Float32Array(cal.qx_1d), GPUBufferUsage.STORAGE, 'qx');
  buffers.qy = makeBufferFromF32(new Float32Array(cal.qy_1d), GPUBufferUsage.STORAGE, 'qy');
  const ssbModule = device.createShaderModule({ code: makeSsbShader(N, nbf), label: `SSB WGSL ${N}` });
  pipelines.rows = device.createComputePipeline({ layout:'auto', compute:{ module:ssbModule, entryPoint:'ssbRows' }});
  pipelines.cols = device.createComputePipeline({ layout:'auto', compute:{ module:ssbModule, entryPoint:'ssbCols' }});
  pipelines.reduce = device.createComputePipeline({ layout:'auto', compute:{ module:ssbModule, entryPoint:'reducePhase' }});
  pipelines.reducePreview = pipelines.reduce;
  if (previewBfCount < nbf) {
    const previewModule = device.createShaderModule({ code: makeSsbShader(N, previewBfCount), label: `SSB WGSL ${N} preview ${previewBfCount} BF` });
    pipelines.reducePreview = device.createComputePipeline({ layout:'auto', compute:{ module:previewModule, entryPoint:'reducePhase' }});
  }
  const rowEntries = [
    { binding:0, resource:{ buffer:buffers.params } },
    { binding:1, resource:{ buffer:buffers.gqk } },
    { binding:2, resource:{ buffer:buffers.stage } },
    { binding:3, resource:{ buffer:buffers.bfGeom } },
    { binding:4, resource:{ buffer:buffers.bfTrig } },
    { binding:5, resource:{ buffer:buffers.qx } },
    { binding:6, resource:{ buffer:buffers.qy } },
  ];
  const colEntries = [
    { binding:0, resource:{ buffer:buffers.params } },
    { binding:2, resource:{ buffer:buffers.stage } },
    { binding:7, resource:{ buffer:buffers.phaseStack } },
  ];
  const reduceEntries = [
    { binding:0, resource:{ buffer:buffers.params } },
    { binding:7, resource:{ buffer:buffers.phaseStack } },
    { binding:8, resource:{ buffer:buffers.phase } },
    { binding:9, resource:{ buffer:buffers.variance } },
  ];
  bindGroups.rows = device.createBindGroup({ layout:pipelines.rows.getBindGroupLayout(0), entries: rowEntries });
  bindGroups.cols = device.createBindGroup({ layout:pipelines.cols.getBindGroupLayout(0), entries: colEntries });
  bindGroups.reduce = device.createBindGroup({ layout:pipelines.reduce.getBindGroupLayout(0), entries: reduceEntries });
  bindGroups.reducePreview = device.createBindGroup({ layout:pipelines.reducePreview.getBindGroupLayout(0), entries: reduceEntries });

  buffers.fftParams = makeEmptyBuffer(16, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST, 'fft params');
  buffers.fftData = makeEmptyBuffer(PLANE * 8, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, 'fft data');
  buffers.fftMag = makeEmptyBuffer(PLANE * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, 'fft mag');
  const fftModule = device.createShaderModule({ code: makeFftShader(N), label:`FFT WGSL ${N}` });
  pipelines.fftRows = device.createComputePipeline({ layout:'auto', compute:{ module:fftModule, entryPoint:'fftRows' }});
  pipelines.fftColsMag = device.createComputePipeline({ layout:'auto', compute:{ module:fftModule, entryPoint:'fftColsMag' }});
  const fftRowEntries = [
    { binding:0, resource:{ buffer:buffers.fftParams } },
    { binding:1, resource:{ buffer:buffers.fftData } },
  ];
  const fftColEntries = [
    { binding:0, resource:{ buffer:buffers.fftParams } },
    { binding:1, resource:{ buffer:buffers.fftData } },
    { binding:2, resource:{ buffer:buffers.fftMag } },
  ];
  bindGroups.fftRows = device.createBindGroup({ layout:pipelines.fftRows.getBindGroupLayout(0), entries: fftRowEntries });
  bindGroups.fftColsMag = device.createBindGroup({ layout:pipelines.fftColsMag.getBindGroupLayout(0), entries: fftColEntries });
  setupPhaseRenderer();
  initializedGpu = true;
}

async function readF32(buffer, length) {
  const read = device.createBuffer({ size: length * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const enc = device.createCommandEncoder();
  enc.copyBufferToBuffer(buffer, 0, read, 0, length * 4);
  device.queue.submit([enc.finish()]);
  await read.mapAsync(GPUMapMode.READ);
  const out = new Float32Array(read.getMappedRange().slice(0));
  read.unmap(); read.destroy();
  return out;
}

async function runSsb(c10, c12, phi12Rad, options={}) {
  await setupGpuBuffers();
  const readVariance = options.readVariance !== false;
  const readPhase = options.readPhase !== false;
  const renderPhase = options.renderPhase === true;
  const bfCount = options.bfCount === previewBfCount ? previewBfCount : cal.num_bf;
  device.queue.writeBuffer(buffers.params, 0, makeParams(c10, c12, phi12Rad));
  const t0 = performance.now();
  const enc = device.createCommandEncoder();
  let pass = enc.beginComputePass({ label:'ssb rows gamma+ifft' });
  pass.setPipeline(pipelines.rows); pass.setBindGroup(0, bindGroups.rows); pass.dispatchWorkgroups(1, N, bfCount); pass.end();
  pass = enc.beginComputePass({ label:'ssb cols ifft+phase' });
  pass.setPipeline(pipelines.cols); pass.setBindGroup(0, bindGroups.cols); pass.dispatchWorkgroups(1, N, bfCount); pass.end();
  pass = enc.beginComputePass({ label:'reduce phase' });
  const preview = bfCount !== cal.num_bf;
  pass.setPipeline(preview ? pipelines.reducePreview : pipelines.reduce);
  pass.setBindGroup(0, preview ? bindGroups.reducePreview : bindGroups.reduce);
  pass.dispatchWorkgroups(Math.ceil(PLANE / 256));
  pass.end();
  device.queue.submit([enc.finish()]);
  if (renderPhase) {
    const renderEnc = device.createCommandEncoder();
    encodePhaseRender(renderEnc, phaseDisplayRange.lo, phaseDisplayRange.hi);
    device.queue.submit([renderEnc.finish()]);
  }
  if (!readPhase && !readVariance) {
    return { phase: null, variance: null, gpuMs: performance.now() - t0, bfCount };
  }
  await device.queue.onSubmittedWorkDone();
  const gpuMs = performance.now() - t0;
  const phase = readPhase ? await readF32(buffers.phase, PLANE) : null;
  const variance = readVariance ? await readF32(buffers.variance, PLANE) : null;
  return { phase, variance, gpuMs, bfCount };
}

function prepareFftInput(phase) {
  let sum = 0;
  for (let i = 0; i < phase.length; i++) sum += phase[i];
  const mean = sum / phase.length;
  const complex = new Float32Array(PLANE * 2);
  for (let y = 0; y < N; y++) {
    const wy = 0.5 * (1 - Math.cos(TWO_PI * y / (N - 1)));
    for (let x = 0; x < N; x++) {
      const wx = 0.5 * (1 - Math.cos(TWO_PI * x / (N - 1)));
      complex[(y*N+x)*2] = (phase[y*N+x] - mean) * wy * wx;
    }
  }
  return complex;
}
async function runDisplayFft(phase) {
  const complex = prepareFftInput(phase);
  device.queue.writeBuffer(buffers.fftData, 0, complex);
  device.queue.writeBuffer(buffers.fftParams, 0, makeFftParams(-1.0));
  const t0 = performance.now();
  const enc = device.createCommandEncoder();
  let pass = enc.beginComputePass({ label:'phase fft rows' });
  pass.setPipeline(pipelines.fftRows); pass.setBindGroup(0, bindGroups.fftRows); pass.dispatchWorkgroups(1, N); pass.end();
  pass = enc.beginComputePass({ label:'phase fft cols mag' });
  pass.setPipeline(pipelines.fftColsMag); pass.setBindGroup(0, bindGroups.fftColsMag); pass.dispatchWorkgroups(1, N); pass.end();
  device.queue.submit([enc.finish()]);
  await device.queue.onSubmittedWorkDone();
  const fftMs = performance.now() - t0;
  const mag = await readF32(buffers.fftMag, PLANE);
  return { mag, fftMs };
}

function diffMetrics(a, b) {
  let maxAbs = 0, sumAbs = 0, maxRel = 0, sumRel = 0, refMaxAbs = 0;
  const diff = new Float32Array(a.length);
  for (let i = 0; i < a.length; i++) {
    const d = Math.abs(a[i] - b[i]);
    diff[i] = d;
    maxAbs = Math.max(maxAbs, d); sumAbs += d;
    refMaxAbs = Math.max(refMaxAbs, Math.abs(b[i]));
    const r = d / Math.max(1e-6, Math.abs(b[i]));
    maxRel = Math.max(maxRel, r); sumRel += r;
  }
  return { maxAbs, meanAbs: sumAbs / a.length, maxRel, meanRel: sumRel / a.length, refMaxAbs, diff };
}
function updateMetrics(rows) {
  const body = $('metrics').querySelector('tbody');
  body.innerHTML = '';
  for (const [name, m] of rows) {
    const ok = passMetric(m);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${name}</td><td>${fmt(m.maxAbs)}</td><td>${fmt(m.meanAbs)}</td><td>${fmt(m.maxRel)}</td><td>${fmt(m.meanRel)}</td><td class="${ok ? 'ok' : 'bad'}">${ok ? 'pass' : 'fail'}</td>`;
    body.appendChild(tr);
  }
  window.__SHOWPTYCHO_PARITY__ = Object.fromEntries(rows.map(([name, m]) => [name, { ...m, diff: undefined, pass: passMetric(m) }]));
}
function clearMetrics(message) {
  const body = $('metrics').querySelector('tbody');
  body.innerHTML = '';
  const tr = document.createElement('tr');
  tr.innerHTML = `<td colspan="6" class="warn">${message}</td>`;
  body.appendChild(tr);
  for (const id of ['diffPhase', 'diffFft']) {
    const canvas = $(id);
    canvas.width = N;
    canvas.height = N;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#050608';
    ctx.fillRect(0, 0, N, N);
  }
  window.__SHOWPTYCHO_PARITY__ = null;
}
function referenceParamsMatch(c10, c12, phi12Rad) {
  const ref = cal.aberrations || {};
  const refPhi = Number.isFinite(ref.phi12) ? Number(ref.phi12) : Number(ref.phi12_deg || 0) * Math.PI / 180;
  return (
    Math.abs(c10 - Number(ref.C10 || 0)) < 1e-6
    && Math.abs(c12 - Number(ref.C12 || 0)) < 1e-6
    && Math.abs(phi12Rad - refPhi) < 1e-6
  );
}
function percentile(values, p) {
  const a = Array.from(values).filter(Number.isFinite).sort((x,y)=>x-y);
  if (!a.length) return 0;
  const idx = Math.min(a.length - 1, Math.max(0, Math.floor((p / 100) * (a.length - 1))));
  return a[idx];
}
function cmapViridis(t) {
  const stops = [[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
  return interpStops(stops, t);
}
function cmapInferno(t) {
  const stops = [[0,0,4],[87,15,109],[187,55,84],[249,142,8],[252,255,164]];
  return interpStops(stops, t);
}
function cmapMagma(t) {
  const stops = [[0,0,4],[73,16,107],[182,54,121],[251,136,97],[252,253,191]];
  return interpStops(stops, t);
}
function interpStops(stops, t) {
  t = Math.max(0, Math.min(1, t));
  const x = t * (stops.length - 1); const i = Math.min(stops.length - 2, Math.floor(x)); const f = x - i;
  return [0,1,2].map(c => Math.round(stops[i][c]*(1-f)+stops[i+1][c]*f));
}
function drawScalar(canvas, data, w, h, cmap='viridis', loPct=1, hiPct=99) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  const lo = percentile(data, loPct), hi = percentile(data, hiPct);
  const span = Math.max(1e-12, hi - lo);
  const map = cmap === 'inferno' ? cmapInferno : cmap === 'magma' ? cmapMagma : cmapViridis;
  for (let i = 0; i < w*h; i++) {
    const [r,g,b] = map((data[i] - lo) / span);
    img.data[i*4+0] = r; img.data[i*4+1] = g; img.data[i*4+2] = b; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
function drawScalarFast(canvas, data, w, h, cmap='viridis') {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < w*h; i++) {
    const v = data[i];
    if (Number.isFinite(v)) {
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
  }
  if (!Number.isFinite(lo) || !Number.isFinite(hi)) { lo = 0; hi = 1; }
  const span = Math.max(1e-12, hi - lo);
  const map = cmap === 'inferno' ? cmapInferno : cmap === 'magma' ? cmapMagma : cmapViridis;
  for (let i = 0; i < w*h; i++) {
    const [r,g,b] = map((data[i] - lo) / span);
    img.data[i*4+0] = r; img.data[i*4+1] = g; img.data[i*4+2] = b; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

async function runCurrent(fullLabel='full BF', options={}) {
  if (runningNow) {
    pendingRun = { label: fullLabel, options };
    return;
  }
  runningNow = true;
  runBtn.disabled = true; dragBtn.disabled = true;
  try {
    const totalT0 = performance.now();
    const c10 = Number($('c10').value);
    const c12 = Number($('c12').value);
    const phi12Rad = Number($('phi12').value) * Math.PI / 180;
    const parityRequested = options.parity !== false;
    const fastPreview = !parityRequested;
    const referenceMatch = referenceParamsMatch(c10, c12, phi12Rad);
    const parity = parityRequested && referenceMatch;
    const bfCount = fastPreview ? previewBfCount : cal.num_bf;
    log(`Running ${fullLabel} WebGPU SSB on ${bfCount}/${cal.num_bf} BF pixels…`);
    const { phase, variance, gpuMs } = await runSsb(
      c10, c12, phi12Rad, {
        readPhase: !fastPreview,
        readVariance: parityRequested,
        renderPhase: fastPreview,
        bfCount,
      },
    );
    if (phase) latestPhase = phase;
    const loss = variance ? variance.reduce((a,b)=>a+b, 0) / variance.length : null;
    append(
      `SSB WGSL time: ${(gpuMs/1000).toFixed(3)} s`
      + (loss === null ? ' (preview).' : `; loss ${loss.toPrecision(8)}.`),
    );
    let fftMs = null;
    let mag = null;
    if (!fastPreview) {
      const fft = await runDisplayFft(phase);
      mag = fft.mag;
      fftMs = fft.fftMs;
      latestFft = mag;
      append(`FFT WGSL time: ${fftMs.toFixed(2)} ms.`);
    } else {
      append('FFT deferred during drag preview.');
    }
    const drawT0 = performance.now();
    if (phase) {
      phaseDisplayRange = { lo: percentile(phase, 1), hi: percentile(phase, 99) };
      const gpuPhaseDrawn = drawPhaseWebGPU(phaseDisplayRange.lo, phaseDisplayRange.hi);
      if (!gpuPhaseDrawn) {
        const draw = parity ? drawScalar : drawScalarFast;
        draw($('gpuPhase'), phase, N, N, 'viridis');
      }
    }
    if (mag) {
      const drawFft = parity ? drawScalar : drawScalarFast;
      drawFft($('gpuFft'), mag, N, N, 'inferno');
    }
    if (parity) {
      const pm = diffMetrics(phase, refPhase);
      const fm = diffMetrics(mag, refFft);
      updateMetrics([['phase', pm], ['FFT log-mag', fm]]);
      drawScalar($('diffPhase'), pm.diff, N, N, 'magma', 0, 100);
      drawScalar($('diffFft'), fm.diff, N, N, 'magma', 0, 100);
    } else if (parityRequested) {
      clearMetrics('Reference check skipped: sliders differ from the saved Python reference.');
    }
    const drawMs = performance.now() - drawT0;
    const totalMs = performance.now() - totalT0;
    window.__SHOWPTYCHO_STATE__ = {
      adapterInfo, softwareAdapter, gpuMs, fftMs, drawMs, totalMs, loss, c10, c12, phi12Rad,
      numBf: cal.num_bf, bfCount, parity, parityRequested, referenceMatch,
    };
    append(
      parity
        ? 'Done. window.__SHOWPTYCHO_PARITY__ contains numeric results.'
        : parityRequested
          ? 'Done. Parameters differ from the Python reference, so parity was skipped.'
        : `Preview done in ${totalMs.toFixed(1)} ms. Click Run Full BF WebGPU to refresh FFT/parity.`,
    );
  } finally {
    runningNow = false;
    runBtn.disabled = false; dragBtn.disabled = false;
    if (pendingRun) {
      const next = pendingRun;
      pendingRun = null;
      setTimeout(() => runCurrent(next.label, next.options), 0);
    }
  }
}

runBtn.addEventListener('click', () => runCurrent('full BF', { parity: true }));
dragBtn.addEventListener('click', async () => {
  const base = Number($('c10').value);
  for (const v of [base - 5, base, base + 5]) {
    $('c10').value = String(v); setSliderLabels();
    await runCurrent(`C10 preview ${v} nm`, { parity: false });
  }
});

(async function main() {
  try {
    await loadData();
    await initWebGPU();
    if (softwareAdapter) append('Software adapter detected. Parity can run, but timing will not be claimed.');
    await runCurrent('full BF initial', { parity: true });
  } catch (err) {
    console.error(err);
    log(`ERROR: ${err && err.message ? err.message : err}`);
  }
})();
</script>
