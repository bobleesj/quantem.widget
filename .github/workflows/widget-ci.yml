name: widget ci

on:
  pull_request:
    paths:
      - ".github/workflows/widget-ci.yml"
      - "docs/**"
      - "gpu-ref.txt"
      - "js/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/widget-ci.yml"
      - "docs/**"
      - "gpu-ref.txt"
      - "js/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # the build and the sync test read the quantem.gpu checkout of gpu-ref.txt
      QUANTEM_GPU_SRC: ${{ github.workspace }}/quantem-gpu-src/src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # The frontend unit tests run when the frontend or its quantem.gpu sources changed.
      - name: Find what changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci_changed_areas.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # The CPU wheel: the CUDA one adds 3 GB of NVIDIA libraries no test uses.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest-xdist==3.8.0
          python -m pip install --extra-index-url https://test.pypi.org/simple/ -e ".[test]"

      # quantem.gpu is optional for the widget at run time, but the bundles compile
      # its WebGPU sources (science kernels, borrowed-image contract), so the build
      # reads them from the ref in gpu-ref.txt (the same checkout widget-docs and
      # widget-release use).
      - name: Read the pinned quantem.gpu ref
        id: gpu
        run: echo "ref=$(cat gpu-ref.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: bobleesj/quantem.gpu
          ref: ${{ steps.gpu.outputs.ref }}
          path: quantem-gpu-src

      - name: Build frontend bundles
        run: |
          npm ci
          npm run build
          npm run build:web  # the quantem.diffsim bundle, for tests/diffsim

      - name: Typecheck and unit-test the frontend
        if: steps.changes.outputs.frontend == 'true'
        run: |
          npx tsc --noEmit  # the build synced the quantem.gpu kernels; `npm run typecheck` would sync them again
          # Keep the multi-widget DOM mounts in a fresh process on small runners.
          # Both commands together run the complete suite, with unchanged timeouts.
          npx vitest run --maxWorkers=2 --exclude js/show3d/controls.test.ts
          npx vitest run js/show3d/controls.test.ts --maxWorkers=1

      - name: Size guards
        run: |
          python scripts/check_large_files.py
          python scripts/check_notebook_sizes.py

      - name: Test
        run: PYTHONPATH=src python -m pytest -q -n 4 --dist worksteal
